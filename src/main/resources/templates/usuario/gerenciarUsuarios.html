<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar usuários</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Vincular usuários a alunos</h1>
    <div class="page-actions">
        <a class="btn-link secondary" href="/home">Voltar ao painel</a>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Usuário</th>
                    <th>Login</th>
                    <th>Role</th>
                    <th>Aluno vinculado</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.nomeUsuario}">Nome</td>
                    <td th:text="${usuario.loginUsuario}">login</td>
                    <td th:text="${usuario.role}">ROLE_USER</td>
                    <td th:text="${usuario.aluno != null ? usuario.aluno.nomeAluno : 'Não vinculado'}">Não vinculado</td>
                    <td>
                        <form class="inline-form" method="post" th:action="@{/usuarios/{id}/aluno(id=${usuario.idUsuario})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <select name="alunoId" required>
                                <option value="" disabled selected>Selecionar aluno</option>
                                <option th:each="aluno : ${alunos}" th:value="${aluno.idAluno}" th:text="${aluno.nomeAluno}"></option>
                            </select>
                            <button class="btn-primary" type="submit">Vincular</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
