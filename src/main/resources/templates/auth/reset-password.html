<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="auth-layout single">
        <div class="auth-card">
            <h2>Redefinir senha</h2>
            <p class="auth-subtitle">Crie uma nova senha para sua conta.</p>

            <form class="auth-form" th:action="@{/redefinir-senha}" method="post" th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{token}">

                <div class="form-field">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" th:field="*{novaSenha}" placeholder="Digite sua nova senha" required>
                </div>

                <div class="form-field">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}" placeholder="Confirme sua nova senha" required>
                </div>

                <button class="btn-primary" type="submit">Salvar nova senha</button>
            </form>

            <div class="auth-links">
                <a class="secondary" href="/login">Voltar ao login</a>
            </div>

            <p class="auth-message success" th:if="${successMessage}" th:text="${successMessage}"></p>
            <p class="auth-message error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        </div>
    </div>
</body>
</html>
