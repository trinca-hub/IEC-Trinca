<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="auth-layout single">
        <div class="auth-card">
            <h2>Recuperar senha</h2>
            <p class="auth-subtitle">Informe o email cadastrado para receber o link de redefinicao.</p>

            <form class="auth-form" th:action="@{/esqueci-senha}" method="post" th:object="${request}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="seuemail@dominio.com" required>
                </div>
                <button class="btn-primary" type="submit">Enviar link</button>
            </form>

            <div class="auth-links">
                <a class="secondary" href="/login">Voltar ao login</a>
            </div>

            <p class="auth-message success" th:if="${successMessage}" th:text="${successMessage}"></p>
            <p class="auth-message error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        </div>
    </div>
</body>
</html>
