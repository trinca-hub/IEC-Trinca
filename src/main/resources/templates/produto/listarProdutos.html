<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Lista de Produtos</h1>
    <div class="page-actions">
        <a class="btn-link" th:href="@{/produtos/criar}">Cadastrar novo produto</a>
        <a class="btn-link secondary" href="/">Voltar à página inicial</a>
    </div>
    <div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>Foto</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th>Unidade</th>
                <th>Marca</th>
                <th colspan="2">Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="produto : ${produtos}">
                <td>
                    <img class="product-thumb" th:if="${produto.fotoProduto != null}"
                         th:src="@{/produtos/imagem/{id}(id=${produto.idProduto})}"
                         th:alt="${produto.descricaoProduto}">
                    <span th:if="${produto.fotoProduto == null}">Sem foto</span>
                </td>
                <td th:text="${produto.descricaoProduto}"></td>
                <td th:text="${produto.valorProduto}"></td>
                <td th:text="${produto.unidadeProduto}"></td>
                <td th:text="${produto.marcaProduto}"></td>
                <td><a th:href="@{/produtos/editar/{id}(id=${produto.idProduto})}">Editar</a></td>
                <td><a th:href="@{/produtos/excluir/{id}(id=${produto.idProduto})}" onclick="return confirm('Tem certeza que deseja excluir este produto?')">Excluir</a></td>
            </tr>
        </tbody>
    </table>
    </div>
</div>
</body>
</html>
