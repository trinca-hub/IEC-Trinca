<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pedidos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <meta name="_csrf" th:content="${_csrf.token}">
</head>
<body class="pedido-page">
<div class="container">
    <h1>Cadastro de Pedido</h1>
    <div class="page-actions">
        <a class="btn-link secondary" th:href="@{/home}">Voltar à página inicial</a>
    </div>

    <section class="card pedido-card">
        <h2>Identificação do aluno</h2>
    <datalist id="listaAlunos">
        <option th:each="aluno : ${alunos}" th:value="${aluno.idAluno + ' - ' + aluno.nomeAluno}"></option>
    </datalist>

    <datalist id="listaProdutos">
        <option th:each="produto : ${produtos}" 
                th:value="${produto.idProduto + ' - ' + produto.descricaoProduto}"
                th:attr="data-preco=${produto.valorProduto}">
        </option>
    </datalist>

    <label for="aluno">Aluno:</label>
    <input list="listaAlunos" id="aluno" type="text" placeholder="Digite o nome ou código do aluno" name="aluno">
    </section>

    <section class="card pedido-card">
        <h2>Adicionar produto ao pedido</h2>
        <div class="pedido-form-grid">
            <div>
                <label for="produto">Produto:</label>
                <input list="listaProdutos" type="text" id="produto" placeholder="Digite o nome ou código do produto">
            </div>
            <div>
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" name="quantidade" min="1" value="1">
            </div>
        </div>
        <button class="btn-primary pedido-add" type="button" onclick="adicionarItem()">
        <span>+</span>Adicionar
        </button>
    </section>

    <section class="pedido-table-wrap">
    <div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Subtotal</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaItens">
             <tr>
                <td colspan="5">Nenhum item adicionado ao pedido.</td>
             </tr>
        </tbody>
    </table>
    </div>
    <div class="pedido-total">
        <span>Total do pedido</span>
        <strong>R$ <span id="totalPedido">0,00</span></strong>
    </div>
    <button class="btn-primary pedido-save" type="button" onclick="salvarPedido()">Confirmar e salvar pedido</button>
    </section>
</div>
    
<script th:inline="none">
        let itens = [];
 
        function adicionarItem() {
            let produtoInput = document.getElementById("produto").value;
            let quantidade = document.getElementById("quantidade").value;
 
            if (!produtoInput || quantidade <= 0) {
                alert("Preencha corretamente o produto e a quantidade!");
                return;
            }
 
            let partes = produtoInput.split(" - ");
            let produtoId = partes[0];
            let produtoNome = partes[1];
 
            let options = document.querySelectorAll("#listaProdutos option");
            let preco = null;
 
            options.forEach(opt => {
                if (opt.value === produtoInput) {
                    preco = opt.getAttribute("data-preco");
                }
            });
 
            if (!preco) {
                alert("Produto inválido! Selecione um produto da lista.");
                return;
            }
 
            let subtotal = quantidade * preco;
 
            itens.push({
                produto: { idProduto: produtoId },
                nomeProduto: produtoNome,
                quantidade: parseInt(quantidade),
                preco: parseFloat(preco),
                subtotal: subtotal
            });
 
            document.getElementById("produto").value = "";
            document.getElementById("quantidade").value = "";
 
            renderTabela();
        }
 
        function removerItem(index) {
            itens.splice(index, 1);
            renderTabela();
        }
 
        function renderTabela() {
            let tabela = document.getElementById("tabelaItens");
            let emptyRow = document.getElementById("empty-row");
 
            tabela.innerHTML = "";
 
            if (itens.length === 0) {
                tabela.innerHTML = `<tr class="empty-row" id="empty-row"><td colspan="5">Nenhum produto adicionado ao pedido.</td></tr>`;
                document.getElementById("totalPedido").innerText = "0,00";
                return;
            }
 
            let total = 0;
 
            itens.forEach((item, index) => {
                total += item.subtotal;
                tabela.innerHTML += `
<tr>
<td>${item.nomeProduto}</td>
<td>${item.quantidade}</td>
<td>R$ ${item.preco.toFixed(2).replace('.', ',')}</td>
<td>R$ ${item.subtotal.toFixed(2).replace('.', ',')}</td>
<td><button class="btn-danger" type="button" onclick="removerItem(${index})">Remover</button></td>
</tr>
                `;
            });
 
            document.getElementById("totalPedido").innerText = total.toFixed(2).replace('.', ',');
        }
 
        function salvarPedido() {
            let alunoInput = document.getElementById("aluno").value;
 
            if (!alunoInput) {
                alert("Selecione um aluno antes de salvar!");
                return;
            }
 
            if (itens.length === 0) {
                alert("Adicione ao menos um produto ao pedido!");
                return;
            }
 
            let alunoId = alunoInput.split(" - ")[0];
 
            let pedido = {
                aluno: { idAluno: Number(alunoId) },
                itens: itens.map(item => ({
                    produto: { idProduto: Number(item.produto.idProduto) },
                    quantidade: item.quantidade
                }))
            };

            let csrfToken = document.querySelector('meta[name="_csrf"]').content;
 
            fetch("/pedidos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-TOKEN": csrfToken
                },
                body: JSON.stringify(pedido)
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error(`Falha ao salvar o pedido (${res.status})`);
                }
                return res.json();
            })
            .then(data => {
                alert("Pedido salvo com sucesso!");
                location.reload();
            })
            .catch(err => {
                alert("Erro ao salvar o pedido. Tente novamente.");
                console.error(err);
            });
        }
</script>

</body>
</html>
