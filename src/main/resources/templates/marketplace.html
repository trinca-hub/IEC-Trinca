<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <meta name="_csrf" th:content="${_csrf.token}">
</head>
<body class="marketplace-body">
<div class="container marketplace-page">
    <div class="marketplace-header">
        <div>
            <p class="eyebrow">FatecADS</p>
            <h1>Marketplace</h1>
            <p class="subtitle">Encontre os produtos disponíveis.</p>
        </div>
        <a class="btn-link" href="/carrinho">Carrinho (<span th:text="${quantidadeCarrinho}">0</span>)</a>
    </div>

    <p class="auth-message success" th:if="${param.sucesso}">Pedido realizado com sucesso.</p>
    <div class="product-grid">
        <article class="product-card" th:each="produto : ${produtos}">
            <div class="product-image">
                <img th:if="${produto.fotoProduto != null}"
                     th:src="@{/produtos/imagem/{id}(id=${produto.idProduto})}"
                     th:alt="${produto.descricaoProduto}">
                <span th:if="${produto.fotoProduto == null}">Sem foto</span>
            </div>
            <div class="product-content">
                <p class="product-brand" th:text="${produto.marcaProduto}">Marca</p>
                <h2 th:text="${produto.descricaoProduto}">Produto</h2>
                <p class="product-unit" th:text="${produto.unidadeProduto}">Unidade</p>
                <strong class="product-price" th:text="${'R$ ' + #numbers.formatDecimal(produto.valorProduto, 1, 2)}">R$ 0,00</strong>
                <form class="cart-form" method="post" th:action="@{/carrinho/adicionar}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="produtoId" th:value="${produto.idProduto}">
                    <label th:for="${'quantidade-' + produto.idProduto}">Quantidade</label>
                    <input type="number" min="1" value="1" name="quantidade" th:id="${'quantidade-' + produto.idProduto}">
                    <button class="btn-primary" type="submit">Adicionar ao carrinho</button>
                </form>
            </div>
        </article>
    </div>
</div>
</body>
</html>
