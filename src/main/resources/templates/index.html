<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FatecADS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="welcome-layout">
    <section class="welcome-panel">
        <p class="eyebrow">Gestão acadêmica</p>
        <h1>FatecADS</h1>
        <p class="welcome-copy">Uma experiência simples para organizar pessoas, produtos e pedidos em um só lugar.</p>
        <div class="welcome-highlights">
            <span>Cadastros organizados</span>
            <span>Marketplace integrado</span>
            <span>Controle por perfil</span>
        </div>
    </section>

    <section class="welcome-card">
        <h2>Bem-vindo</h2>
        <p>Entre na sua conta ou crie um novo acesso para começar.</p>
        <div class="welcome-actions">
            <a class="btn-primary" href="/login">Acessar sistema</a>
            <a class="btn-link secondary" href="/usuarios/criar">Criar cadastro</a>
        </div>
    </section>
</main>
</body>
</html>
